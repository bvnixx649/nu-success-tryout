<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>ลองฟังเสียง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap">
<style>
  :root { --bg: #0c0c0e; --surface: #17171a; --surface-2: #222226; --ink: #f4f4f5; --muted: #a1a1aa; --win: #06c755; --on-win: #06210f; --accent: #ff8126; color-scheme: dark }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Anuphan', system-ui, sans-serif; line-height: 1.5 }
  main { max-width: 520px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 28px }
  h1 { font-size: 24px; margin: 0 }
  h2 { font-size: 17px; margin: 0 0 10px }
  p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px }
  button { font: 600 16px 'Anuphan', system-ui, sans-serif; color: var(--ink); background: var(--surface-2); border: 0; border-radius: 14px; padding: 14px 10px; cursor: pointer; transition: transform 120ms }
  button:active { transform: scale(0.96) }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
  .demo { background: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px }
  .stage { display: flex; align-items: center; justify-content: center; gap: 18px; height: 120px }
  .disc { width: 88px; height: 88px; border-radius: 50%; background: var(--win); color: var(--on-win); display: grid; place-items: center }
  .disc svg { width: 50%; height: 50% }
  .disc path { fill: none; stroke: currentColor; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round }
  .big { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em }
  .go { background: var(--accent); color: #1a0d04 }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 55% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }
  .play .disc { animation: pop 460ms cubic-bezier(0.23, 1, 0.32, 1) both }
</style>
</head>
<body>
<main>
  <div>
    <h1>ลองฟังเสียง</h1>
    <p>เปิดเสียงเครื่องก่อน iPhone ต้องปิดโหมดเงียบด้วย</p>
  </div>

  <section class="demo">
    <div class="stage" id="stage"><div class="disc"><svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9"/></svg></div><span class="big">+<span id="n">6</span></span></div>
    <div class="row" id="combos"></div>
  </section>
</main>
<script src="sfx.js"></script>
<script>
  const COMBOS = [
    { name: 'ไม้', chime: 'marimba', tick: 'none' },
    { name: 'ไม้ + เคาะ', chime: 'marimba', tick: 'wood' },
    { name: 'จ่ายเงิน', chime: 'pay', tick: 'none' },
    { name: 'จ่ายเงิน + เคาะ', chime: 'pay', tick: 'wood' },
  ]
  // Ticks follow the same ease-out timing as the number on screen.
  function runTicks(k, delay, el) {
    const dur = 820, t0 = performance.now() + delay
    let last = 0
    el.textContent = 0
    const step = (now) => {
      const p = Math.min(1, Math.max(0, (now - t0) / dur))
      const v = Math.round(6 * (1 - Math.pow(1 - p, 3)))
      if (v !== last) { last = v; if (k !== 'none') SFX.tick(k, v); el.textContent = v }
      if (p < 1) requestAnimationFrame(step)
    }
    requestAnimationFrame(step)
  }
  const el = document.getElementById('combos')
  el.innerHTML = COMBOS.map((c, i) => `<button type="button" data-i="${i}">${c.name}</button>`).join('')
  el.onclick = (e) => {
    const b = e.target.closest('[data-i]')
    if (!b) return
    const c = COMBOS[+b.dataset.i]
    SFX.unlock()
    const st = document.getElementById('stage')
    st.classList.remove('play'); void st.offsetWidth; st.classList.add('play')
    setTimeout(() => SFX.chime(c.chime), 220)
    runTicks(c.tick, 300, document.getElementById('n'))
  }
</script>
</body>
</html>
